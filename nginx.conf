server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Angular handles the routing, so any unknown path falls back to index.html.
    # Without this, reloading on /profile would return a 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets don't change between builds, so they can be cached
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
}