<div class="loading" role="status" aria-live="polite">
    <svg class="pokeball" viewBox="0 0 100 100" aria-hidden="true">
        <!-- The rain lines are clipped to the ball, so they stay inside it -->
        <clipPath id="ballClip">
            <circle cx="50" cy="50" r="46" />
        </clipPath>

        <path d="M4 50a46 46 0 0 1 92 0z" fill="#ee1515" />
        <path d="M4 50a46 46 0 0 0 92 0z" fill="#fff" />

        <g clip-path="url(#ballClip)">
            @for (line of lines; track $index) {
            <rect class="drop" [attr.x]="14 + $index * 8" y="30" width="3" height="18" rx="1.5" fill="#5bc8f5"
                [style.animation-delay]="$index * 0.12 + 's'" />
            }
        </g>

        <circle cx="50" cy="50" r="46" fill="none" stroke="#1a1a1a" stroke-width="4" />
        <path d="M4 50h92" stroke="#1a1a1a" stroke-width="4" />
        <circle cx="50" cy="50" r="13" fill="#fff" stroke="#1a1a1a" stroke-width="4" />
    </svg>

    <p class="message">{{ message() }}</p>
</div>
